name: musiclab
description: Aplicacion de musica privada para Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  youtube_player_iframe: ^6.0.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19
  file_picker: ^13.3.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true
