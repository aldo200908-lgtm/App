name: MusicLab Alpha 02 ARM64 APK
on:
  push:
    branches: [musiclab-alpha01-build]
    paths:
      - 'musiclab02/**'
      - '.github/workflows/musiclab-alpha02.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack MusicLab Alpha 02
        run: |
          cd musiclab02
          base64 -d source.tar.xz.b64 > musiclab-source.tar.xz
          tar -xJf musiclab-source.tar.xz
          rm musiclab-source.tar.xz
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate Android platform
        working-directory: musiclab02
        run: flutter create --project-name musiclab --org com.aptitudlabs --platforms android .
      - name: Fix compatibility with file_picker 13 and Flutter generated test
        working-directory: musiclab02
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('Slider(value: pos, max: total > 0 ? total : 1,', 'Slider(value: pos, max: total > 0 ? total : 1.0,')
          p.write_text(s)
          p = Path('lib/music_library.dart')
          s = p.read_text()
          s = s.replace('FilePicker.platform.pickFiles(type: FileType.audio, allowMultiple: true)', 'FilePicker.pickFiles(type: FileType.audio)')
          s = s.replace('if (selection == null) return 0;', 'if (selection.isEmpty) return 0;')
          s = s.replace('for (final selected in selection.files) {', 'for (final selected in selection) {')
          p.write_text(s)
          Path('test/widget_test.dart').unlink(missing_ok=True)
          PY
      - name: Android permissions + background audio
        working-directory: musiclab02
        run: python3 tool/configure_android.py
      - name: Download dependencies
        working-directory: musiclab02
        run: flutter pub get
      - name: Verify Dart code
        working-directory: musiclab02
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        working-directory: musiclab02
        run: flutter test
      - name: Build ARM64 APK
        working-directory: musiclab02
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Alpha-02-ARM64-APK
          path: musiclab02/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
