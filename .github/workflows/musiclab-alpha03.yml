name: MusicLab Alpha 03 - Diagnostico HTTP
on:
  push:
    branches: [musiclab-alpha01-build]
    paths:
      - 'musiclab03/**'
      - '.github/workflows/musiclab-alpha03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Unpack MusicLab Alpha 03
        run: |
          cd musiclab03
          base64 -d source.tar.xz.b64 > source.tar.xz
          tar -xJf source.tar.xz
          rm source.tar.xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Flutter Android template
        working-directory: musiclab03
        run: |
          flutter create --project-name musiclab --org com.aptitudlabs --platforms android .
          rm -f test/widget_test.dart
      - name: Enable detailed playback diagnostics
        working-directory: musiclab03
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/music_player.dart')
          s = p.read_text()
          s = s.replace('  String? error;\n', '  String? error;\n  String? errorDetails;\n')
          s = s.replace('  bool get isPlaying => player.playing;', '  bool get isPlaying => player.playing && error == null;')
          s = s.replace("      error = 'La fuente no permitió reproducir esta pista.';", "      errorDetails = 'Error nativo: ${e.runtimeType}: ${e.toString()}';\n      error = 'El reproductor ha rechazado el audio.';")
          s = s.replace('    error = null;\n    loading = true;', '    error = null;\n    errorDetails = null;\n    loading = true;')
          s = s.replace('    try {\n      final song = queue[index];', "    var stage = 'Iniciando';\n    try {\n      final song = queue[index];")
          s = s.replace('      final uri = song.source == MusicSource.youtube', "      stage = song.source == MusicSource.youtube ? 'Obtener pista de YouTube' : 'Preparar pista';\n      final uri = song.source == MusicSource.youtube")
          s = s.replace('      await player.setAudioSource(', "      stage = 'Abrir pista con Android';\n      await player.setAudioSource(")
          s = s.replace("      error = 'No se pudo abrir el audio. En YouTube puede deberse a restricciones o errores 403. Prueba otra pista.';", "      errorDetails = 'Etapa: $stage\\nTipo: ${e.runtimeType}\\n${e.toString()}';\n      error = 'No se pudo reproducir: revisa el diagnóstico.';\n      await player.stop();")
          s = s.replace('    if (isPlaying) {\n      await player.pause();', '    if (error != null) {\n      await _startIndex(currentIndex);\n    } else if (isPlaying) {\n      await player.pause();')
          p.write_text(s)
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';")
          old="                if (player.error != null) Text(player.error!, style: const TextStyle(color: Colors.amber, fontSize: 12)),"
          new="""                if (player.error != null) Text(player.error!, style: const TextStyle(color: Colors.amber, fontSize: 12)),
                if (player.error != null) TextButton.icon(
                  onPressed: () {
                    final details = player.errorDetails ?? player.error!;
                    showDialog<void>(context: context, builder: (dialogContext) => AlertDialog(
                      title: const Text('Diagnóstico del audio'),
                      content: SingleChildScrollView(child: SelectableText(details)),
                      actions: [
                        TextButton(onPressed: () => Navigator.pop(dialogContext), child: const Text('Cerrar')),
                        FilledButton(onPressed: () {
                          Clipboard.setData(ClipboardData(text: details));
                          Navigator.pop(dialogContext);
                        }, child: const Text('Copiar')),
                      ],
                    ));
                  },
                  icon: const Icon(Icons.bug_report_outlined),
                  label: const Text('Ver diagnóstico'),
                ),"""
          if old not in s:
              raise Exception('Player error indicator not found in main.dart')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Probe YouTube audio URLs before opening Android player
        working-directory: musiclab03
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/catalog.dart')
          s = p.read_text()
          start=s.index('  Future<Uri> resolveYouTubeAudio(String videoId) async {')
          end=s.index('\n  Future<List<Song>> audius(',start)
          replacement="""  Future<Uri> resolveYouTubeAudio(String videoId) async {
    final manifest = await _yt.videos.streams
        .getManifest(videoId).timeout(const Duration(seconds: 28));
    final streams = manifest.audioOnly.toList();
    if (streams.isEmpty) {
      throw StateError('YouTube no ofrece una pista de audio accesible.');
    }
    // Prefer formats Android can normally decode; fall back to alternative
    // available streams only when the server confirms that the URL works.
    streams.sort((a, b) {
      final aMp4 = a.container.toString().toLowerCase().contains('mp4') ? 1 : 0;
      final bMp4 = b.container.toString().toLowerCase().contains('mp4') ? 1 : 0;
      if (aMp4 != bMp4) return bMp4.compareTo(aMp4);
      return b.bitrate.bitsPerSecond.compareTo(a.bitrate.bitsPerSecond);
    });
    final attempts = <String>[];
    for (final candidate in streams.take(4)) {
      final name = '${candidate.container} (${candidate.audioCodec})';
      try {
        final request = http.Request('GET', candidate.url)
          ..headers['Range'] = 'bytes=0-1';
        final response = await _client.send(request)
            .timeout(const Duration(seconds: 8));
        // Do not download or store any audio data for the probe.
        final subscription = response.stream.listen((_) {});
        await subscription.cancel();
        attempts.add('$name: HTTP ${response.statusCode}');
        if (response.statusCode == 200 || response.statusCode == 206) {
          return candidate.url;
        }
      } catch (e) {
        attempts.add('$name: ${e.runtimeType}');
      }
    }
    throw StateError(
      'YouTube rechazó la reproducción de audio. Resultado de las fuentes: '
      '${attempts.join('; ')}. No hay una pista accesible para Android.',
    );
  }
"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Background audio manifest
        working-directory: musiclab03
        run: python3 tool/configure_android.py
      - name: Resolve dependencies
        working-directory: musiclab03
        run: flutter pub get
      - name: Analyzer
        working-directory: musiclab03
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        working-directory: musiclab03
        run: flutter test
      - name: Build Android ARM64
        working-directory: musiclab03
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-Alpha-03-HTTP-APK
          path: musiclab03/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
